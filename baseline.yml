---
# First AAP job template: a tiny "baseline" for node-r9 (RHEL 9) and node-r10 (RHEL 10).
- name: Lab baseline
  hosts: all
  become: true
  tasks:
    - name: Report what we're talking to
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs RHEL {{ ansible_facts['distribution_version'] }}"

    - name: Install admin tools (same on both)
      ansible.builtin.dnf:
        name: [tmux, vim-enhanced]
        state: present

    - name: RHEL 10 only - example of a fact-driven task
      ansible.builtin.debug:
        msg: "This task runs only on RHEL 10"
      when: ansible_facts['distribution_major_version'] | int == 10

    - name: Login banner
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Managed by AAP. RHEL {{ ansible_facts['distribution_major_version'] }} lab node.\n"
        mode: "0644"
