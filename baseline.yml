---
# Lab baseline v2: adds a loop and a handler (DO007 "constructs").
- name: Lab baseline
  hosts: all
  become: true
  vars:
    time_server: 169.254.169.123   # Amazon Time Sync; on-prem this would be your NTP servers (group_vars)
    baseline_services:
      - chronyd
      - sshd

  tasks:
    - name: Report what we're talking to
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs RHEL {{ ansible_facts['distribution_version'] }}"

    - name: Install admin tools (same on both)
      ansible.builtin.dnf:
        name: [tmux, vim-enhanced, chrony]
        state: present

    - name: RHEL 10 only - example of a fact-driven task
      ansible.builtin.debug:
        msg: "This task runs only on RHEL 10"
      when: ansible_facts['distribution_major_version'] | int == 10

    - name: Login banner
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Managed by AAP. RHEL {{ ansible_facts['distribution_major_version'] }} lab node.\n"
        mode: "0644"

    - name: Point chrony at our time server
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        regexp: '^server 169\.254\.169\.123'
        line: "server {{ time_server }} prefer iburst"
      notify: restart chronyd

    - name: Make sure baseline services are enabled and running (loop)
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ baseline_services }}"

  handlers:
    - name: restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted
